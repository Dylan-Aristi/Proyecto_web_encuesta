<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción PAE - IE MJM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- ==================== PANTALLA 1: WELCOME ==================== -->
        <div id="welcomeScreen" class="screen active">
            <div class="welcome-content">
                <div class="logo-container">
                    <img src="assets/logo.png" alt="Logo IE MJM">
                </div>
                <div>
                    <div class="welcome-title">BIENVENIDOS</div>
                    <div class="welcome-subtitle">SATISFACCIÓN PAE</div>
                    <div class="welcome-subtitle">IE MJM</div>
                </div>
                <button class="button-large" onclick="goToScreen('homeScreen')">INICIAR</button>
            </div>
        </div>

        <!-- ==================== PANTALLA 2: HOME ==================== -->
        <div id="homeScreen" class="screen">
            <div class="header">
                <div class="header-title">MENÚ DE LA SEMANA</div>
            </div>
            <div class="days-container">
                <button class="day-button" onclick="goToDayScreen('LUNES')">LUNES</button>
                <button class="day-button" onclick="goToDayScreen('MARTES')">MARTES</button>
                <button class="day-button" onclick="goToDayScreen('MIÉRCOLES')">MIÉRCOLES</button>
                <button class="day-button" onclick="goToDayScreen('JUEVES')">JUEVES</button>
                <button class="day-button" onclick="goToDayScreen('VIERNES')">VIERNES</button>
            </div>
        </div>

        <!-- ==================== PANTALLA 3: DAY ==================== -->
        <div id="dayScreen" class="screen">
            <div class="header">
                <div class="day-title" id="dayScreenTitle">LUNES</div>
            </div>
            <div class="scroll-content">
                <div class="meal-image-container">
                    <i class="fas fa-utensils"></i>
                </div>
                <div class="pae-buttons-container">
                    <button class="pae-button" onclick="goToFeedbackScreen('PAE REFRIGERIO')">
                        <i class="fas fa-mug-hot"></i>
                        <span>PAE REFRIGERIO</span>
                    </button>
                    <button class="pae-button" onclick="goToFeedbackScreen('PAE ALMUERZO')">
                        <i class="fas fa-utensils"></i>
                        <span>PAE ALMUERZO</span>
                    </button>
                </div>
            </div>
            <div class="bottom-button-container">
                <button class="button-volver" onclick="goToScreen('homeScreen')">VOLVER</button>
            </div>
        </div>

        <!-- ==================== PANTALLA 4: FEEDBACK ==================== -->
        <div id="feedbackScreen" class="screen">
            <div class="header">
                <div class="feedback-title" id="feedbackTitle">PAE REFRIGERIO</div>
                <div class="feedback-subtitle" id="feedbackSubtitle">LUNES</div>
            </div>
            
            <div class="feedback-scroll">
                <!-- Sección 0: Datos del estudiante -->
                <div class="section-container">
                    <div class="section-title">Datos del estudiante</div>
                    <input type="text" class="text-input" id="attendanceStudentNameInput" placeholder="Nombre completo" style="min-height: 50px; margin-bottom: 15px;">
                    
                    <select class="text-input" id="attendanceStudentGradeInput" style="min-height: 50px; appearance: auto; color: #fff;">
                        <option value="" disabled selected style="color: #AAB8A6;">Selecciona tu grado</option>
                        <option value="6-1" style="color: #000;">6-1</option>
                        <option value="6-2" style="color: #000;">6-2</option>
                        <option value="7-1" style="color: #000;">7-1</option>
                        <option value="7-2" style="color: #000;">7-2</option>
                        <option value="8-1" style="color: #000;">8-1</option>
                        <option value="8-2" style="color: #000;">8-2</option>
                        <option value="9-1" style="color: #000;">9-1</option>
                        <option value="9-2" style="color: #000;">9-2</option>
                        <option value="10-1" style="color: #000;">10-1</option>
                        <option value="10-2" style="color: #000;">10-2</option>
                        <option value="11-1" style="color: #000;">11-1</option>
                        <option value="11-2" style="color: #000;">11-2</option>
                    </select>
                </div>

                <!-- Sección 1: Calidad de la comida -->
                <div class="section-container">
                    <div class="section-title">Calidad de la comida</div>
                    <div class="section-subtitle">Califica tu experiencia con las estrellas</div>
                    <div class="stars-container" id="starsContainer">
                        <button class="star-button" onclick="setRating(1)" data-star="1">
                            <i class="far fa-star"></i>
                        </button>
                        <button class="star-button" onclick="setRating(2)" data-star="2">
                            <i class="far fa-star"></i>
                        </button>
                        <button class="star-button" onclick="setRating(3)" data-star="3">
                            <i class="far fa-star"></i>
                        </button>
                        <button class="star-button" onclick="setRating(4)" data-star="4">
                            <i class="far fa-star"></i>
                        </button>
                        <button class="star-button" onclick="setRating(5)" data-star="5">
                            <i class="far fa-star"></i>
                        </button>
                    </div>
                    <div class="rating-text" id="ratingText" style="display: none;"></div>
                </div>

                <!-- Sección 2: Recomendaciones -->
                <div class="section-container">
                    <div class="section-title">Recomendaciones</div>
                    <textarea class="text-input" id="recommendationsInput" placeholder="Ejemplo: Le faltó sal"></textarea>
                </div>
            </div>

            <!-- Botones inferiores -->
            <div class="bottom-button-container">
                <div class="feedback-buttons-container">
                    <button class="button-volver" onclick="goBackToDayScreen()">VOLVER</button>
                    <button class="button-enviar" onclick="sendFeedback()">ENVIAR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== CUSTOM ALERT MODAL ==================== -->
    <div id="customAlertOverlay" class="alert-overlay">
        <div class="alert-box">
            <div class="alert-icon" id="alertIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="alert-message" id="alertMessage">Mensaje aquí</div>
            <button class="alert-button" onclick="closeCustomAlert()">ACEPTAR</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
